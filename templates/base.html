<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gere relatórios visuais sobre participação, tipos de commit e hotspots de um repositório GitHub, sem cadastro e sem armazenar dados.">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Analisador de Commits{% endblock %}</title>

  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%230d9488'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 20l4-8 4 5 3-4 3 3' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 btn btn-primary z-3" href="#conteudo-principal">Pular para o conteúdo</a>

  <header class="app-header border-bottom sticky-top">
    <div class="container py-3 d-flex align-items-center justify-content-between gap-3">
      <a href="{{ url_for('analyzer.index') }}" class="text-decoration-none text-body d-inline-flex align-items-center gap-2">
        <span class="brand-mark" aria-hidden="true"><i class="bi bi-diagram-3-fill"></i></span>
        <span class="font-heading fw-bold fs-5">Analisador de Commits</span>
      </a>
      <button id="botao-tema" type="button" class="theme-toggle btn btn-outline-secondary rounded-circle" aria-label="Alternar tema claro/escuro">
        <i class="bi bi-sun-fill" aria-hidden="true"></i>
        <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main id="conteudo-principal" class="container py-4 py-lg-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer py-4 mt-5">
    <div class="container d-flex flex-wrap justify-content-between gap-2 small">
      <span>Analisador de Commits &mdash; análise pontual, sem cadastro e sem persistência de dados.</span>
      <span>Feito com Flask, Bootstrap e Plotly.</span>
    </div>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
